name: release

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Add snapshot timestamp to versions"
        required: false
        type: boolean
      spec:
        description: "The URL for the openapi spec"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}

jobs:
  check-new-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      vrc-api-version: ${{ steps.vrc-api-version.outputs.version }}
      spec-url: ${{ steps.vrc-api-version.outputs.spec-url }}
      npm-version: ${{ steps.npm-info.outputs.package-version }}

    steps:
      # vrchatapi/specification retired the `release/*` tags at 1.20.5 and now ships specs as
      # `v*` GitHub Releases, with nightlies flagged as prereleases. Its gh-pages copy of
      # openapi.yaml is no longer updated either, so the releases are the source of truth.
      - name: Get VRChat API Release Version
        id: vrc-api-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(gh api repos/vrchatapi/specification/releases --paginate \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | sort -V | tail -1)"
          if [ -z "$tag" ]; then
            echo "::error::Found no stable release in vrchatapi/specification"
            exit 1
          fi
          echo "Latest stable spec release: $tag"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "spec-url=https://github.com/vrchatapi/specification/releases/download/$tag/openapi.yaml" >> "$GITHUB_OUTPUT"

      - name: Get Registry Info
        id: npm-info
        run: |
          npm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}
          echo "package-version=$(npm view --registry https://npm.pkg.github.com @furality/vrchat-ts-client dist-tags.latest)" >> $GITHUB_OUTPUT

  publish-client:
    needs: check-new-release
    if: needs.check-new-release.outputs.vrc-api-version != needs.check-new-release.outputs.npm-version || inputs.snapshot

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download spec
        run: wget ${{ inputs.spec || needs.check-new-release.outputs.spec-url }} -O openapi.yaml

      # `Transaction.agreement` is an inline `oneOf: [string, $ref TransactionAgreement]`.
      # openapi-generator names it `Transaction_agreement`, which normalizes to the same TS
      # model name/file as the real `TransactionAgreement` schema, producing the self-referential
      # `type TransactionAgreement = string | TransactionAgreement` (TS2456). Giving the inline
      # schema an explicit title takes it out of the collision.
      # Remove once fixed upstream in vrchatapi/specification.
      - name: Disambiguate inline Transaction.agreement schema
        run: |
          yq -i 'with(
            .components.schemas.Transaction.properties
              | select(has("agreement")) | .agreement | select(has("oneOf"));
            .title = "TransactionAgreementOrString"
          )' openapi.yaml

      - name: Upload spec artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: openapi.yaml
          path: openapi.yaml

      - name: Generate & publish client
        uses: furality/generate-esm-api-client@v8
        with:
          author: Furality
          package_name: "@furality/vrchat-ts-client"
          spec_file: openapi.yaml
          repo_url: git+ssh://git@github.com/${{ github.repository }}.git
          npm_token: ${{ secrets.GITHUB_TOKEN }}
          snapshot: ${{ inputs.snapshot }}
